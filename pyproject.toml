[project]
name = "pixel-pipeline"
version = "0.1.0"
description = "Strict AI-image to pixel-art pipeline for ComfyUI: grid detection/restore, palette quantisation and crisp nearest-neighbour export."
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Single source of truth: ComfyUI Manager installs requirements.txt, and the
# registry build reads the same file.
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/PeaarLi/ComfyUI-PixelPipeline"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.comfy]
PublisherId = "PearLi"
DisplayName = "Pixel Pipeline"
Icon = ""
# 0.37.0 is the only version this pack has actually been run against, so the
# floor states the verified fact rather than a guessed minimum. The newest
# capabilities used here are:
#   * io.DynamicCombo (grid_mode on PixelGridRestore and PixelVideoGridRestore),
#     which needs BOTH a backend that serialises COMFY_DYNAMICCOMBO_V3 and a
#     frontend that renders it -- verified against comfyui-frontend-package
#     1.53.6, where it also resolves nested widget translations;
#   * the VIDEO type (io.Video + VideoFromComponents / VideoComponents) used by
#     PixelVideoGridRestore. Also present in 0.37.0, and likewise only exercised
#     from core nodes before this pack used it.
# Lower bounds have NOT been tested.
requires-comfyui = ">=0.37.0"
